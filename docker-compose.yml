version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: roca_postgres
    restart: always
    environment:
      POSTGRES_USER: roca_user
      POSTGRES_PASSWORD: roca_secure_password
      POSTGRES_DB: roca_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roca_user -d roca_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roca_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://roca_user:roca_secure_password@postgres:5432/roca_analytics
      GANACHE_RPC_URL: http://host.docker.internal:7545
      ENVIRONMENT: production
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roca_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
